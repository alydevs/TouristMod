name: TouristMod
author: Anna, maintained by foophoof, modified by alydevs
punchline: Finish your sightseeing log.
description: |-
  TouristMod adds a window to assist with the sightseeing log.

  - ! Added vnavmesh support
  - ! Hide vistas if corresponding quest is not complete
  - Show when sightseeing log vistas are available
  - Add markers for ARR vistas
  - Open vista locations on your map
  - Hide already completed or unavailable vistas
  - Show the command needed for each vista

  "sightseeing" icon by muhammad, from thenounproject.com CC BY 3.0
repo_url: https://github.com/alydevs/TouristModMod/
tags:
  - Utility
  - Sightseeing
  - Log
  - Vista
  - Completion
